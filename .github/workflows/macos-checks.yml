name: macOS checks

on:
  pull_request:
    paths:
      - "macos/**"
      - "assets/licenses/**"
      - "assets/fonts/*license*"
      - "assets/icons/weather/LICENSE*"
      - "tools/package_notices.py"
      - "tools/release_version.py"
      - "docs/vibe/install*.md"
      - "docs/vibe/connections*.md"
      - "tests/vibe/test_radio_playback.py"
      - "tests/vibe/test_radio_stream.c"
      - "main/vibe/adpcm.*"
      - "main/vibe/radio/stream.h"
      - ".github/workflows/macos-checks.yml"
  push:
    branches: [main]
    paths:
      - "macos/**"
      - "assets/licenses/**"
      - "assets/fonts/*license*"
      - "assets/icons/weather/LICENSE*"
      - "tools/package_notices.py"
      - "tools/release_version.py"
      - "docs/vibe/install*.md"
      - "docs/vibe/connections*.md"
      - "tests/vibe/test_radio_playback.py"
      - "tests/vibe/test_radio_stream.c"
      - "main/vibe/adpcm.*"
      - "main/vibe/radio/stream.h"
      - ".github/workflows/macos-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: Universal app, native tests and packaging
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build arm64 and x86_64; validate app, DMG and ZIP
        run: bash macos/build.sh
      - name: Install audio fixture generator
        run: command -v ffmpeg >/dev/null || brew install ffmpeg
      - name: Validate packaged decoder, HTTP, HLS and cancellation
        run: python3 tests/vibe/test_radio_playback.py --executable "build/macos/Vibe 伴侣.app/Contents/MacOS/VibeCompanion"
